<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Customer Churn Prediction</title>

</head>


<body>

    <h1>Customer Churn Prediction System</h1>

    <p>
        Enter customer information to predict
        whether the customer is likely to churn.
    </p>

    <hr>


    <form action="/predict" method="POST">


        <!-- STATE -->

        <label for="state">
            State:
        </label>

        <select id="state"
                name="state"
                required>

            <option value="SC">SC</option>
            <option value="LA">LA</option>
            <option value="CA">CA</option>
            <option value="NY">NY</option>
            <option value="TX">TX</option>
            <option value="FL">FL</option>
            <option value="GA">GA</option>
            <option value="IL">IL</option>
            <option value="NJ">NJ</option>
            <option value="OH">OH</option>
            <option value="PA">PA</option>
            <option value="VA">VA</option>
            <option value="WA">WA</option>
            <option value="OR">OR</option>
            <option value="ID">ID</option>
            <option value="MT">MT</option>
            <option value="AK">AK</option>
            <option value="AL">AL</option>
            <option value="AR">AR</option>
            <option value="AZ">AZ</option>
            <option value="CO">CO</option>
            <option value="CT">CT</option>
            <option value="DE">DE</option>
            <option value="HI">HI</option>
            <option value="IA">IA</option>
            <option value="IN">IN</option>
            <option value="KS">KS</option>
            <option value="KY">KY</option>
            <option value="MA">MA</option>
            <option value="MD">MD</option>
            <option value="ME">ME</option>
            <option value="MI">MI</option>
            <option value="MN">MN</option>
            <option value="MO">MO</option>
            <option value="MS">MS</option>
            <option value="NC">NC</option>
            <option value="ND">ND</option>
            <option value="NE">NE</option>
            <option value="NH">NH</option>
            <option value="NM">NM</option>
            <option value="NV">NV</option>
            <option value="NY">NY</option>
            <option value="OK">OK</option>
            <option value="RI">RI</option>
            <option value="SD">SD</option>
            <option value="TN">TN</option>
            <option value="UT">UT</option>
            <option value="VT">VT</option>
            <option value="WI">WI</option>
            <option value="WV">WV</option>
            <option value="WY">WY</option>

        </select>

        <br><br>


        <!-- ACCOUNT LENGTH -->

        <label for="account_length">
            Account Length:
        </label>

        <input
            type="number"
            id="account_length"
            name="account_length"
            required
        >

        <br><br>


        <!-- AREA CODE -->

        <label for="area_code">
            Area Code:
        </label>

        <input
            type="number"
            id="area_code"
            name="area_code"
            required
        >

        <br><br>


        <!-- INTERNATIONAL PLAN -->

        <label for="international_plan">
            International Plan:
        </label>

        <select
            id="international_plan"
            name="international_plan"
            required
        >

            <option value="No">No</option>
            <option value="Yes">Yes</option>

        </select>

        <br><br>


        <!-- VOICE MAIL PLAN -->

        <label for="voice_mail_plan">
            Voice Mail Plan:
        </label>

        <select
            id="voice_mail_plan"
            name="voice_mail_plan"
            required
        >

            <option value="No">No</option>
            <option value="Yes">Yes</option>

        </select>

        <br><br>


        <!-- NUMBER VMAIL MESSAGES -->

        <label for="number_vmail_messages">
            Number of Voice Mail Messages:
        </label>

        <input
            type="number"
            id="number_vmail_messages"
            name="number_vmail_messages"
            required
        >

        <br><br>


        <!-- DAY MINUTES -->

        <label for="total_day_minutes">
            Total Day Minutes:
        </label>

        <input
            type="number"
            step="0.01"
            id="total_day_minutes"
            name="total_day_minutes"
            required
        >

        <br><br>


        <!-- DAY CALLS -->

        <label for="total_day_calls">
            Total Day Calls:
        </label>

        <input
            type="number"
            id="total_day_calls"
            name="total_day_calls"
            required
        >

        <br><br>


        <!-- DAY CHARGE -->

        <label for="total_day_charge">
            Total Day Charge:
        </label>

        <input
            type="number"
            step="0.01"
            id="total_day_charge"
            name="total_day_charge"
            required
        >

        <br><br>


        <!-- EVENING MINUTES -->

        <label for="total_eve_minutes">
            Total Evening Minutes:
        </label>

        <input
            type="number"
            step="0.01"
            id="total_eve_minutes"
            name="total_eve_minutes"
            required
        >

        <br><br>


        <!-- EVENING CALLS -->

        <label for="total_eve_calls">
            Total Evening Calls:
        </label>

        <input
            type="number"
            id="total_eve_calls"
            name="total_eve_calls"
            required
        >

        <br><br>


        <!-- EVENING CHARGE -->

        <label for="total_eve_charge">
            Total Evening Charge:
        </label>

        <input
            type="number"
            step="0.01"
            id="total_eve_charge"
            name="total_eve_charge"
            required
        >

        <br><br>


        <!-- NIGHT MINUTES -->

        <label for="total_night_minutes">
            Total Night Minutes:
        </label>

        <input
            type="number"
            step="0.01"
            id="total_night_minutes"
            name="total_night_minutes"
            required
        >

        <br><br>


        <!-- NIGHT CALLS -->

        <label for="total_night_calls">
            Total Night Calls:
        </label>

        <input
            type="number"
            id="total_night_calls"
            name="total_night_calls"
            required
        >

        <br><br>


        <!-- NIGHT CHARGE -->

        <label for="total_night_charge">
            Total Night Charge:
        </label>

        <input
            type="number"
            step="0.01"
            id="total_night_charge"
            name="total_night_charge"
            required
        >

        <br><br>


        <!-- INTERNATIONAL MINUTES -->

        <label for="total_intl_minutes">
            Total International Minutes:
        </label>

        <input
            type="number"
            step="0.01"
            id="total_intl_minutes"
            name="total_intl_minutes"
            required
        >

        <br><br>


        <!-- INTERNATIONAL CALLS -->

        <label for="total_intl_calls">
            Total International Calls:
        </label>

        <input
            type="number"
            id="total_intl_calls"
            name="total_intl_calls"
            required
        >

        <br><br>


        <!-- INTERNATIONAL CHARGE -->

        <label for="total_intl_charge">
            Total International Charge:
        </label>

        <input
            type="number"
            step="0.01"
            id="total_intl_charge"
            name="total_intl_charge"
            required
        >

        <br><br>


        <!-- CUSTOMER SERVICE CALLS -->

        <label for="customer_service_calls">
            Customer Service Calls:
        </label>

        <input
            type="number"
            id="customer_service_calls"
            name="customer_service_calls"
            required
        >

        <br><br><br>


        <!-- SUBMIT -->

        <button type="submit">
            Predict Churn
        </button>


    </form>


</body>

</html>
