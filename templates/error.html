{% extends "base.html" %}

{% block title %}{{ title|default('Error Encountered') }} - AadiBI{% endblock %}

{% block content %}
<div class="animate-fade-in" style="max-width: 540px; margin: 4rem auto 0; text-align: center;">
    <div class="card" style="padding: 3rem 2rem; border-top: 4px solid var(--danger);">
        <div style="font-size: 3rem; margin-bottom: 1rem;">⚠️</div>
        <h2 style="font-size: 1.6rem; color: #FFF; margin-bottom: 0.5rem;">{{ title|default('System Error') }}</h2>
        <p style="color: var(--text-muted); font-size: 0.92rem; margin-bottom: 2rem;">
            {{ message|default('An unexpected error occurred while processing your request.') }}
        </p>
        <a href="{{ url_for('dashboard') }}" class="btn btn-primary">
            🏠 Return to Dashboard
        </a>
    </div>
</div>
{% endblock %}
