{% extends "base.html" %}

{% block title %}Sign In - AadiBI Churn Intelligence{% endblock %}

{% block content %}
<div style="max-width: 440px; margin: 4rem auto 0;" class="animate-fade-in">
    <div class="card" style="padding: 2.5rem 2rem; border-top: 4px solid var(--primary); box-shadow: var(--shadow-glow);">
        <div style="text-align: center; margin-bottom: 2rem;">
            <div class="brand-icon" style="margin: 0 auto 1rem; width: 48px; height: 48px; font-size: 1.5rem;">
                🛡️
            </div>
            <h2 style="font-size: 1.6rem; margin-bottom: 0.4rem;">Executive Access Portal</h2>
            <p style="color: var(--text-muted); font-size: 0.88rem;">Sign in to access real-time churn predictions and BI dashboards.</p>
        </div>

        <form action="{{ url_for('login') }}" method="POST">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" class="form-control" placeholder="e.g. admin or analyst" required autofocus>
            </div>

            <div class="form-group" style="margin-bottom: 1.75rem;">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.8rem; font-size: 1rem;">
                🔐 Authenticate & Launch App
            </button>
        </form>

        <div style="margin-top: 2rem; padding-top: 1.25rem; border-top: 1px solid var(--border-color); text-align: center; font-size: 0.82rem; color: var(--text-muted);">
            <div style="font-weight: 700; color: #FFF; margin-bottom: 0.4rem;">Demo Accounts Available:</div>
            <div style="display: flex; justify-content: space-around; margin-top: 0.5rem;">
                <span class="mono" style="background: rgba(255,255,255,0.05); padding: 0.25rem 0.5rem; border-radius: 4px;">admin / admin123</span>
                <span class="mono" style="background: rgba(255,255,255,0.05); padding: 0.25rem 0.5rem; border-radius: 4px;">analyst / analyst123</span>
            </div>
        </div>
    </div>
</div>
{% endblock %}
